<body><main><h1>Co zmienia restart kernela</h1><svg id="kernel-state" class="diagram" viewBox="0 0 352 408" role="img" aria-labelledby="kernel-state-title kernel-state-desc" style="display:block;width:100%;max-width:352px;height:auto;margin:0 auto">
<title id="kernel-state-title">Co zmienia restart kernela</title>
<desc id="kernel-state-desc">Restart usuwa nazwę stock z pamięci kernela, a ponowne wykonanie przypisania ją odtwarza; zapisany kod pozostaje w pliku.</desc>
<defs>
<marker id="kernel-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--ink-2, #52514e)"/></marker>
<marker id="kernel-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent, #2a78d6)"/></marker>
<marker id="kernel-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent-ink, #1c5cab)"/></marker>
</defs>
<style>
#kernel-state text { fill: var(--ink, #0b0b0b); font-family: var(--sans, system-ui, sans-serif); font-size: 12px; }
#kernel-state .name { font-size: 14px; font-weight: 600; }
#kernel-state .code { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
#kernel-state .muted { fill: var(--ink-2, #52514e); }
#kernel-state .accent-text { fill: var(--accent-ink, #1c5cab); }
#kernel-state .paper { fill: var(--plane, #f9f9f7); }
#kernel-state .node { fill: var(--surface, #fcfcfb); stroke: var(--ink-2, #52514e); stroke-width: 1; }
#kernel-state .focus { fill: var(--accent-wash, #e8f1fd); stroke: var(--accent, #2a78d6); }
#kernel-state .edge { fill: none; stroke: var(--ink-2, #52514e); stroke-width: 1.2; }
#kernel-state .accent-edge { stroke: var(--accent, #2a78d6); }
#kernel-state .lifeline { stroke: var(--axis, #c3c2b7); stroke-width: 1; stroke-dasharray: 3 5; }
#kernel-state .rule { stroke: var(--hairline, #e1e0d9); stroke-width: 1; }
</style>

</svg><p>Restart czyści pamięć kernela. Zapisany kod zostaje w pliku. Aby zmienne znów były dostępne, wykonaj komórki w potrzebnej kolejności.</p><p><a href="../a3-environment.html#miejsca">Wróć do lekcji</a></p></main></body></html>
