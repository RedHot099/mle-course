<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dwie nazwy, jedna lista</title><style>
:root { color-scheme:light; --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --axis:#c3c2b7; --hairline:#e1e0d9; --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:#e8f1fd; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
@media(prefers-color-scheme:dark) { :root { color-scheme:dark; --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --axis:#383835; --hairline:#2c2c2a; --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:#13263f; } }
body { margin:0; padding:16px; background:var(--plane); color:var(--ink); font-family:var(--sans); }
main { max-width:480px; margin:auto; }
h1 { font-size:1.25rem; line-height:1.3; font-weight:700; }
p { font-size:.9rem; line-height:1.55; }
a { color:var(--accent-ink); }
</style></head>
<body><main><h1>Dwie nazwy, jedna lista</h1><svg id="shared-list" class="diagram" viewBox="0 0 368 384" role="img" aria-labelledby="shared-list-title shared-list-desc" style="display:block;width:100%;max-width:368px;height:auto;margin:0 auto">
<title id="shared-list-title">Dwie nazwy, jedna lista</title>
<desc id="shared-list-desc">Original i other wskazują tę samą listę, więc append wykonane przez other jest widoczne także przez original.</desc>
<defs>
<marker id="shared-list-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--ink-2, #52514e)"/></marker>
<marker id="shared-list-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent, #2a78d6)"/></marker>
<marker id="shared-list-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent-ink, #1c5cab)"/></marker>
</defs>
<style>
#shared-list text { fill: var(--ink, #0b0b0b); font-family: var(--sans, system-ui, sans-serif); font-size: 12px; }
#shared-list .name { font-size: 14px; font-weight: 600; }
#shared-list .code { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
#shared-list .muted { fill: var(--ink-2, #52514e); }
#shared-list .accent-text { fill: var(--accent-ink, #1c5cab); }
#shared-list .paper { fill: var(--plane, #f9f9f7); }
#shared-list .node { fill: var(--surface, #fcfcfb); stroke: var(--ink-2, #52514e); stroke-width: 1; }
#shared-list .focus { fill: var(--accent-wash, #e8f1fd); stroke: var(--accent, #2a78d6); }
#shared-list .edge { fill: none; stroke: var(--ink-2, #52514e); stroke-width: 1.2; }
#shared-list .accent-edge { stroke: var(--accent, #2a78d6); }
#shared-list .lifeline { stroke: var(--axis, #c3c2b7); stroke-width: 1; stroke-dasharray: 3 5; }
#shared-list .rule { stroke: var(--hairline, #e1e0d9); stroke-width: 1; }
</style>
<path d="M136 64 H168 Q176 64 176 72 V100 Q176 108 184 108 H216" class="edge" marker-end="url(#shared-list-arrow)"/><path d="M136 200 H152 Q160 200 160 192 V152 Q160 144 168 144 H216" class="edge" marker-end="url(#shared-list-arrow)"/><rect x="40" y="40" width="96" height="48" rx="6" class="node"/><text x="88.0" y="69.0" class="code" text-anchor="middle">original</text><rect x="40" y="176" width="96" height="48" rx="6" class="node"/><text x="88.0" y="205.0" class="code" text-anchor="middle">other</text><rect x="216" y="88" width="112" height="80" rx="6" class="node focus"/><text x="272.0" y="114" class="name" text-anchor="middle">Jedna lista</text><text x="272.0" y="136" class="code muted" text-anchor="middle">[3, 5, 8]</text><text x="184" y="264" class="code" text-anchor="middle">other.append(8) zmienia tę listę.</text><text x="184" y="288" class="muted" text-anchor="middle">Zmianę widać przez obie nazwy.</text><line x1="40" y1="324" x2="328" y2="324" class="rule"/><text x="40" y="348" class="muted" text-anchor="start">Strzałka: nazwa wskazuje obiekt.</text>
</svg><p>Stan po other.append(8) z przykładu powyżej. Dwie nazwy prowadzą do jednej listy. Zmiana tej listy jest widoczna przez każdą z nich.</p><p><a href="../b5-collections.html#alias">Wróć do lekcji</a></p></main></body></html>
