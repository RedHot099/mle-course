[project]
name = "mle-course"
version = "0.1.0"
description = "Python, data and ML/AI foundations: a self-paced course"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jakub Eichner" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=3.0,<4",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "playwright>=1.55", "nbformat>=5.10", "nbclient>=0.10"]
neural = ["torch>=2.9,<2.10"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
files = ["tools"]
warn_return_any = true
show_error_codes = true
disallow_untyped_defs = true
